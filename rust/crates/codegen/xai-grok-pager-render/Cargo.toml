[package]
name = "xai-grok-pager-render"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"

[dependencies]
# TTY safety
dunce = { workspace = true }
xai-tty-utils = { workspace = true }

# Rendering
ratatui = { workspace = true, features = [
    "crossterm",
    "unstable-widget-ref",
    "unstable-backend-writer",
] }
ratatui-core = { workspace = true }
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
textwrap = { workspace = true }
regex = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
linkify = { workspace = true }
tui-scrollbar = { workspace = true }

# Markdown / syntax highlighting
xai-grok-markdown = { workspace = true }
syntect = { workspace = true }
anstyle = { workspace = true }
supports-color = { workspace = true }

# Data
serde = { workspace = true, features = ["derive"] }
toml = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }
documented = { workspace = true }

# VTE terminal emulation for native rendering of command output (SGR, cursor, \r)
vte = { workspace = true }

# System appearance detection (dark/light mode)
dark-light = "2"

# Utilities
strum = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tracing = { workspace = true }

# Prompt text input
xai-ratatui-textarea = { workspace = true }
xai-ratatui-inline = { workspace = true }
arboard = { workspace = true, optional = true }

# Config + path resolution (both retained in m0irai; activated by frontend-runtime).
xai-grok-config = { workspace = true, optional = true }
xai-grok-paths = { path = "../xai-grok-paths", optional = true }

# Base64 encoding for image data
base64 = { workspace = true, optional = true }

# Image decoding/resizing for clipboard image validation before send
image = { workspace = true, features = ["png", "jpeg", "tiff", "gif", "webp"], optional = true }

# ID generation
uuid = { workspace = true, features = ["v4"], optional = true }

# Path computation
dirs = { workspace = true, optional = true }
shellexpand = { version = "3.1", optional = true }

# Parsing
url = { workspace = true, optional = true }

# Hot-reload config (dev mode)
notify = { workspace = true, optional = true }

# libc: poll/read for non-blocking terminal reads in theme/osc11.rs.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

# EnumDisplaySettingsW for primary-display refresh probe (host/display_refresh).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi"], optional = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }

[lints.rust]
# See the workspace root: the `grok-runtime` cfg sites left in src/ name a
# feature this crate no longer has (its service adapters were pruned with their
# crates). Declared known-but-never-set; the code goes in the M2 fine-prune.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("grok-runtime"))',
] }

[features]
# m0irai: the room is the only consumer. `grok-runtime` (ACP + xai-grok-shared /
# -workspace / -telemetry) was deleted with those crates; `room-runtime` is the
# one runtime that exists here, so it is the default.
default = ["room-runtime"]
# The actual terminal, theme, rendering, and presentation modules shared by
# Grok and Zer0. The service adapters that used to sit behind `grok-runtime`
# are gone from m0irai along with their crates; the ~62 remaining
# cfg(feature = "grok-runtime") sites in src/ are permanently inert (M2 removes
# the code itself).
frontend-runtime = [
    "dep:xai-grok-config", "dep:xai-grok-paths",
    "dep:base64", "dep:image", "dep:uuid", "dep:dirs", "dep:shellexpand",
    "dep:url", "dep:libc", "dep:windows-sys", "dep:arboard",
]
room-runtime = ["frontend-runtime"]
# Exposes `#[cfg(test)]` test-only helpers (mock setters, test guards,
# deterministic pinning) to downstream crates' test builds. Enabled by
test-support = []
# CI builds a single shared rlib variant per crate, so the pager's CI
# test target links the same render lib as production. Enabling the test-only
# helpers in the CI default set keeps them present for the pager test while
# leaving cargo's `default` (and thus cargo production builds) without them.
# The helpers are inert unless their mock setters are called.
default-bazel = ["test-support"]
