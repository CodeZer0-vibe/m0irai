[package]
name = "xai-grok-pager"
version = "1.0.0"
edition.workspace = true
license = "Apache-2.0"
authors = ["xAI"]
autobins = false
# Target auto-discovery is OFF: 11 of the 18 test roots and 2 of the 4 benches
# under this crate need `grok-runtime` modules whose crates are not vendored in
# m0irai. The FILES stay (the pager is kept whole; M2 fine-prunes); only the
# targets that compile under the retained feature set are declared below.
autotests = false
autobenches = false

[dependencies]
# TTY safety — detach subprocesses from the controlling terminal
dunce = { workspace = true }
xai-tty-utils = { workspace = true }
xai-grok-version = { workspace = true }

# Shared prompt-queue wire types
xai-prompt-queue = { workspace = true }

# Presentation-primitives layer (extracted)
xai-grok-pager-render = { path = "../xai-grok-pager-render", default-features = false }

# Rendering
ratatui = { workspace = true, features = ["crossterm", "unstable-widget-ref"] }
crossterm = { workspace = true, features = ["event-stream", "bracketed-paste"] }
textwrap = { workspace = true }
regex = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
strip-ansi-escapes = { workspace = true }
enum_delegate = { workspace = true }

# Markdown / syntax highlighting
xai-grok-markdown = { workspace = true }
# Inline Mermaid rendering engine. Always compiled (no feature gate): the
# dagre-based vendored engine renders detected ```mermaid fences out of process,
# gated only at runtime by the `appearance.render_mermaid` setting.
xai-grok-mermaid = { workspace = true }
syntect = { workspace = true }

# Data
similar = { workspace = true }
indexmap = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true, features = ["serde"] }

# ANSI parsing (tracing pane)
ansi-to-tui = { workspace = true }

# PTY for ssh wrapper, e2e tests, and benchmarking.
portable-pty = "0.9"

# Utilities
derive_more = { workspace = true, features = ["deref", "deref_mut"] }
anyhow = { workspace = true }
shlex = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
    "time",
] }
tokio-util = { workspace = true, features = ["compat"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Binary hardening: compile-time string obfuscation.
# (cryptify / rustls / semver / tikv-jemallocator moved to the composition-root
# binary `xai-grok-pager-bin` with `main.rs`; this lib no longer references them.)
obfstr = { workspace = true }

# Fuzzy matching (history search daemon)
nucleo = { workspace = true }

# Prompt text input
xai-ratatui-textarea = { workspace = true }
xai-ratatui-inline = { workspace = true }
zer0-room-protocol = { path = "../../zer0-room-protocol" }

# Timestamps (activated by `frontend-runtime`).
chrono = { workspace = true, optional = true }

# Parsing (web_search)
url = { workspace = true }

[dev-dependencies]
xai-grok-pager-render = { path = "../xai-grok-pager-render", default-features = false, features = ["test-support"] }
pretty_assertions = { workspace = true }
insta = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
serial_test = { workspace = true }

# Benches that compile against the room's feature set. `edit_highlight` and
# `resize` were dropped: both need `xai_grok_pager::diff` (grok-runtime).
[[bench]]
name = "render"
harness = false

[[bench]]
name = "search"
harness = false

# Test targets that compile and pass under the retained features (measured,
# Phase 4). Dropped, with the first compiler error for each:
#   settings_e2e             xai_grok_pager::{app,settings,views::settings_modal} + xai_grok_shell
#   grok_home_paths          xai_grok_pager::disk_usage_cmd
#   mermaid_render_subprocess xai_grok_pager::app
#   pty_e2e_{smoke,queue,scroll_selection,minimal,config_ui,persistence,clipboard}
#                            tests/pty_e2e/* -> `base64` / xai_grok_pager::app
#   pty_e2e_shell_tools      xai_grok_workspace
# leader_pty_e2e / scripted_scenarios / pty_auto_mode / pty_xtversion compiled,
# but only via the xai-grok-pager-pty-harness dev edge, which is pruned: that
# crate's own tests shell out to build `xai-grok-pager-bin` (grok's composition
# root, deleted here) and fail 10/10 with
# "package ID specification `xai-grok-pager-bin` did not match any packages".
# All of those are grok-product surface; none of them ran in the room build.
[[test]]
name = "doctor_early_dispatch"
path = "tests/doctor_early_dispatch.rs"

# Previously auto-discovered; declared explicitly now that autotests is off.
[[test]]
name = "selection_model_public_api"
path = "tests/selection_model_public_api.rs"

[[test]]
name = "signal_errno_preservation"
path = "tests/signal_errno_preservation.rs"

# Opt into [workspace.lints.clippy] (too_many_arguments etc.). Without this,
# `cargo clippy --workspace -- -D warnings` on this package is stricter than
# the workspace-default clippy allows used in CI.
[lints]
workspace = true

[features]
# What the room activates (zer0-v2-bin pulls this crate with
# default-features = false + `room-runtime`, so the room build is unchanged by
# this line). `default = []` also compiles, but then this crate's own test
# targets only build through workspace feature unification.
default = ["room-runtime"]
frontend-runtime = ["xai-grok-pager-render/frontend-runtime", "dep:chrono"]
room-runtime = ["frontend-runtime", "xai-grok-pager-render/room-runtime"]
room-test-support = ["room-runtime", "xai-grok-pager-render/test-support"]
# Demo-only: adds the welcome card's `r` replay / `q` quit keys to the room's
# key handler so the entrance animation can be judged in a real terminal.
# Never enabled by a shipping build; `release-dist` does not reference it.
welcome-demo = ["room-runtime"]
release-dist = []
# Exposes test-only view-model constructors/setters (e.g. `test_agent_view`,
# `AgentSession::set_yolo_mode_for_test`) to sibling crates' test builds — used
# by `xai-grok-pager-minimal`'s unit tests. Never enabled in production builds.
test-support = ["xai-grok-pager-render/test-support"]
